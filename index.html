<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Clean</title>
<meta name="description" content="Orbit Clean – clean junk files and keep your Android phone tidy.">
<style>
  :root { --brand: #3DBFA5; --brand-dark: #26A08C; --text: #1A1F36; --muted: #5B6478; --bg: #F3F6FA; }
  @media (prefers-color-scheme: dark) { :root { --text: #E8ECF3; --muted: #A3ACBD; --bg: #11151C; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; padding: 24px 16px; }
  main { text-align: center; max-width: 420px; }
  .logo { width: 96px; height: 96px; border-radius: 24px; margin: 0 auto 20px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--brand), var(--brand-dark)); }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p { margin: 0 0 24px; color: var(--muted); }
  a { color: var(--brand-dark); font-weight: 600; }
  @media (prefers-color-scheme: dark) { a { color: var(--brand); } }
  nav { display: flex; gap: 20px; justify-content: center; font-size: 15px; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"><path d="M4.08 20.4 12 3.6l7.92 16.8M2.88 12.96h18.24"/></svg>
  </div>
  <h1>Orbit Clean</h1>
  <p>Clean junk files and keep your Android phone tidy.</p>
  <nav>
    <a href="privacy/">Privacy Policy</a>
    <a href="mailto:zzz13221126@163.com">Contact</a>
  </nav>
</main>
</body>
</html>
